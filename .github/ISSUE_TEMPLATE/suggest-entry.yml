name: Suggest an entry
description: Propose a project or app for the list
labels: ["entry"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository or product URL
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: All three are required. See "What counts" in the README.
      options:
        - label: Dialogue is generated by a language model at runtime, not authored in advance
          required: true
        - label: There is a romantic or courtship frame
          required: true
        - label: State carries between messages (a meter, a memory, a stage, an unlock)
          required: true
        - label: The main draw is not explicit content
          required: true
  - type: textarea
    id: mechanics
    attributes:
      label: What does it actually do
      description: Concrete mechanics, not marketing copy. What happens when the player sends a bad message?
    validations:
      required: true
  - type: checkboxes
    id: affiliation
    attributes:
      label: Affiliation
      options:
        - label: I am affiliated with this project
